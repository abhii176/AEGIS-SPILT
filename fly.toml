# Fly.io deploy (requires `fly auth login` + FLY_API_TOKEN)
# https://fly.io/docs/apps/launch/
#
# Click / CLI path:
#   fly launch --no-deploy
#   fly postgres create  # or set DATABASE_URL from Neon
#   fly secrets set DATABASE_URL=... DEMO_ADMIN_KEY=hackathon-demo-key PAYPAL_MOCK=true PAYPAL_AUTO_CAPTURE=true
#   fly deploy
#   fly apps open
# Then set APP_BASE_URL=https://<app>.fly.dev (and PayPal return/cancel) via secrets.

app = "aegis-split"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
