# Render Blueprint — one-click deploy for hackathon judges
# Docs: https://render.com/docs/blueprint-spec
#
# Free path: Neon Postgres (external) + Render Web Service.
# 1) Create a Neon free project → copy connection string
# 2) Blueprint deploy this file (or use the Deploy to Render button in README)
# 3) Paste DATABASE_URL when prompted; after first deploy set APP_BASE_URL
#    to the public https://*.onrender.com URL (or rely on RENDER_EXTERNAL_URL fallback)
#
# PayPal: PAYPAL_MOCK / PAYPAL_AUTO_CAPTURE / credentials use sync:false so the
# Render dashboard is source of truth. Blueprint must NOT hardcode PAYPAL_MOCK=true
# (that overwrote dashboard PAYPAL_MOCK=false on every sync and forced MOCK-ORDER).
# Judges without sandbox creds: set PAYPAL_MOCK=true (and optionally AUTO_CAPTURE=true).
# Live sandbox: PAYPAL_MOCK=false, PAYPAL_AUTO_CAPTURE=false, fill CLIENT_ID/SECRET.

services:
  - type: web
    name: aegis-split
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Paste Neon (or other) Postgres URL in the Render dashboard / Blueprint confirm UI
      - key: DATABASE_URL
        sync: false
      # Optional override; if empty, app uses https://$RENDER_EXTERNAL_HOSTNAME
      - key: APP_BASE_URL
        sync: false
      - key: PAYPAL_RETURN_URL
        sync: false
      - key: PAYPAL_CANCEL_URL
        sync: false
      # Dashboard-owned — do not Blueprint-force true (was overwriting live sandbox)
      - key: PAYPAL_MOCK
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_AUTO_CAPTURE
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Dashboard-owned — required only for POST /api/webhooks/paypal verification
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DEMO_ADMIN_KEY
        value: hackathon-demo-key
      - key: MONITORING_CONSENT_VERSION
        value: "1.0.0"
      - key: DEFAULT_MILESTONE_CURRENCY
        value: USD
      # Dashboard-owned. A hardcoded `deterministic` here overwrote
      # AI_AUDITOR_PROVIDER=gemini on every blueprint sync and forced the keyword check.
      - key: AI_AUDITOR_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
